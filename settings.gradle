pluginManagement {
    plugins {
        id 'fabric-loom' version "${loom_version}" apply false
        id "maven-publish" apply false
        id 'com.palantir.git-version' version "${gradle_git_rev_version}" apply false
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

include 'shared'
include 'versioned:sc1.21.11', 'versioned:sc1.21.9', 'versioned:sc1.21.2', 'versioned:sc1.21'
include 'versioned:sc1.20.5', 'versioned:sc1.20.3', 'versioned:sc1.20.2', 'versioned:sc1.20'
include 'versioned:sc1.19.4', 'versioned:sc1.19.3', 'versioned:sc1.19'
include 'versioned:sc1.18'
include 'versioned:sc1.17.1', 'versioned:sc1.17'
include 'versioned:sc1.16.5', 'versioned:sc1.16.4', 'versioned:sc1.16.2', 'versioned:sc1.16'
include 'versioned:sc1.15.1'
